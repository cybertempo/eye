# Dev-container configuration: identical to config/eye.example.toml except that
# the server binds every interface inside the container's own network namespace.
# deploy/dev/compose.yaml shares that namespace with the demo database (so the
# database is on loopback) and publishes only the web port, on host loopback.
schema_version = 1

[runtime]
mode = "demo"

[server]
bind_host = "0.0.0.0"
port = 8765
container_internal_bind = true
max_response_bytes = 1048576
request_timeout_seconds = 10
max_connections = 16

[auth]
adapter = "demo"
private_adapter_module = ""

[data]
capture_fixtures = "../../tests/fixtures/synthetic/captures"
ais_capture_fixtures = "../../tests/fixtures/synthetic/ais/demo"
event_capture_fixtures = "../../tests/fixtures/synthetic/events/demo"
count_lines = "../../reference/lines"

[database]
url_env = "EYE_DATABASE_URL"

[providers]
enabled = []
