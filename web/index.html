<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EYE synthetic demo</title>
  <link rel="stylesheet" href="/static/demo.css">
  <script type="module" src="/static/demo.js"></script>
</head>
<body>
  <header>
    <h1>EYE synthetic demo</h1>
    <p class="banner">SYNTHETIC DATA. Nothing on this page describes a real aircraft, vessel, road or event.</p>
  </header>
  <main>
    <p id="status" role="status">Loading synthetic snapshot…</p>
    <section aria-labelledby="coverage-h"><h2 id="coverage-h">Coverage</h2><table id="coverage"></table></section>
    <section aria-labelledby="tracks-h"><h2 id="tracks-h">Tracks</h2><table id="tracks"></table></section>
    <section aria-labelledby="events-h"><h2 id="events-h">Events</h2><table id="events"></table></section>
  </main>
</body>
</html>
