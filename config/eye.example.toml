# EYE example configuration: synthetic demo on loopback.
#
# This is the only configuration file the public repository needs. A private
# deployment keeps its own copy outside the repository; never commit real
# hostnames, credentials, account identifiers or paths here.
schema_version = 1

[runtime]
# "demo" serves synthetic fixtures with demo authentication.
# "production" requires the private authentication adapter and has no fallback.
mode = "demo"

[server]
# Demo mode refuses any address that is not loopback.
bind_host = "127.0.0.1"
port = 8765
# Only the dev container may set this (with bind_host = "0.0.0.0").
container_internal_bind = false
max_response_bytes = 1048576
request_timeout_seconds = 10
max_connections = 16

[auth]
# "demo" or "private". Production must use "private".
adapter = "demo"
# Production only: importable module providing create_auth_port(config).
# It is installed privately and never committed to this repository.
private_adapter_module = ""

[data]
# Relative paths resolve from this file's directory.
fixture = "../tests/fixtures/synthetic/demo_snapshot.json"

[providers]
# Real provider adapters stay disabled until approved in
# docs/source-policy-register.md. Package 0 has none, so this must stay empty.
enabled = []
