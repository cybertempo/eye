# EYE example configuration: synthetic demo on loopback.
#
# This is the only configuration file the public repository needs. A private
# deployment keeps its own copy outside the repository; never commit real
# hostnames, credentials, account identifiers or paths here.
schema_version = 1

[runtime]
# "demo" serves synthetic fixtures with demo authentication.
# "production" requires the private authentication adapter and has no fallback.
mode = "demo"

[server]
# Demo mode refuses any address that is not loopback.
bind_host = "127.0.0.1"
port = 8765
# Only the dev container may set this (with bind_host = "0.0.0.0").
container_internal_bind = false
max_response_bytes = 1048576
request_timeout_seconds = 10
max_connections = 16

[api]
# Browser API bounds. Every query, response, queue and buffer is limited.
# Empty: a WebSocket Origin must match the request's own Host (same origin).
# A private deployment behind its gateway sets the gateway's public origin.
allowed_origin = ""
max_websockets = 8
# Hard cap on bytes queued for one WebSocket client (at least
# server.max_response_bytes); a slower client is disconnected, never buffered
# without limit. The kernel send buffer adds at most 32 KiB per socket.
ws_max_buffer_bytes = 2097152
ws_max_inbound_bytes = 16384
ws_send_timeout_seconds = 5
ws_idle_timeout_seconds = 120
ws_ping_seconds = 30
# How often the server looks for new committed batches and derivation runs.
poll_interval_ms = 1000
db_pool_size = 4
query_timeout_ms = 5000
max_interval_hours = 168
max_tracks = 1000
max_points = 20000
max_coverage = 1000
max_counts = 168
max_crossings = 1000
# Event-ledger cases per snapshot (each with at most 100 versions).
max_events = 500
# A subscriber further behind than this gets a fresh snapshot instead of deltas.
max_pending_changes = 50
# The default view is the latest hours that have any coverage.
default_view_hours = 4

[view]
area_name = "Synthetic test area near 0N 0E (open ocean; no real features)"
bbox = [-0.5, -0.5, 0.5, 0.5]
layers = ["flight", "vessel", "road"]

[auth]
# "demo" or "private". Production must use "private".
adapter = "demo"
# Production only: importable module providing create_auth_port(config).
# It is installed privately and never committed to this repository.
private_adapter_module = ""

[data]
# Relative paths resolve from this file's directory.
# Synthetic capture batches loaded by `python -m eye db-load-fixtures` (demo only).
capture_fixtures = "../tests/fixtures/synthetic/captures"
# Synthetic AIS captures (Package 2) loaded by the same command (demo only).
ais_capture_fixtures = "../tests/fixtures/synthetic/ais/demo"
# Synthetic event-report captures (Package 4c) loaded by the same command (demo only).
event_capture_fixtures = "../tests/fixtures/synthetic/events/demo"
# Versioned count lines used by `python -m eye db-derive-transits`.
count_lines = "../reference/lines"

[database]
# Name of the environment variable holding the PostgreSQL URL. The URL (and
# any password) is never written in this file. Demo mode accepts only a
# loopback database host.
url_env = "EYE_DATABASE_URL"

[providers]
# Real provider adapters stay disabled until approved in
# docs/source-policy-register.md. Package 0 has none, so this must stay empty.
enabled = []
