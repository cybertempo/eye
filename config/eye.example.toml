# EYE example configuration: synthetic demo on loopback.
#
# This is the only configuration file the public repository needs. A private
# deployment keeps its own copy outside the repository; never commit real
# hostnames, credentials, account identifiers or paths here.
schema_version = 1

[runtime]
# "demo" serves synthetic fixtures with demo authentication.
# "production" requires the private authentication adapter and has no fallback.
mode = "demo"

[server]
# Demo mode refuses any address that is not loopback.
bind_host = "127.0.0.1"
port = 8765
# Only the dev container may set this (with bind_host = "0.0.0.0").
container_internal_bind = false
max_response_bytes = 1048576
request_timeout_seconds = 10
max_connections = 16

[api]
# Browser API bounds. Every query, response, queue and buffer is limited.
# Empty: a WebSocket Origin must match the request's own Host (same origin).
# A private deployment behind its gateway sets the gateway's public origin.
allowed_origin = ""
max_websockets = 8
# Hard cap on bytes queued for one WebSocket client (at least
# server.max_response_bytes); a slower client is disconnected, never buffered
# without limit. The kernel send buffer adds at most 32 KiB per socket.
ws_max_buffer_bytes = 2097152
ws_max_inbound_bytes = 16384
ws_send_timeout_seconds = 5
ws_idle_timeout_seconds = 120
ws_ping_seconds = 30
# How often the server looks for new committed batches and derivation runs.
poll_interval_ms = 1000
db_pool_size = 4
query_timeout_ms = 5000
max_interval_hours = 168
max_tracks = 1000
max_points = 20000
max_coverage = 1000
max_counts = 168
max_crossings = 1000
# Event-ledger cases per snapshot (each with at most 100 versions).
max_events = 500
# News and media items per snapshot (each with at most 100 versions).
max_media = 200
# A subscriber further behind than this gets a fresh snapshot instead of deltas.
max_pending_changes = 50
# The default view is the latest hours that have any coverage.
default_view_hours = 4

[view]
area_name = "Synthetic test area near 0N 0E (open ocean; no real features)"
bbox = [-0.5, -0.5, 0.5, 0.5]
layers = ["flight", "vessel", "road"]

[auth]
# "demo" or "private". Production must use "private".
adapter = "demo"
# Production only: importable module providing create_auth_port(config).
# It is installed privately and never committed to this repository.
private_adapter_module = ""

[data]
# Relative paths resolve from this file's directory.
# Synthetic capture batches loaded by `python -m eye db-load-fixtures` (demo only).
capture_fixtures = "../tests/fixtures/synthetic/captures"
# Synthetic AIS captures (Package 2) loaded by the same command (demo only).
ais_capture_fixtures = "../tests/fixtures/synthetic/ais/demo"
# Synthetic event-report captures (Package 4c) loaded by the same command (demo only).
event_capture_fixtures = "../tests/fixtures/synthetic/events/demo"
# Synthetic news and media captures (Package 4d) loaded by the same command (demo only).
media_capture_fixtures = "../tests/fixtures/synthetic/media/demo"
# Versioned count lines used by `python -m eye db-derive-transits`.
count_lines = "../reference/lines"

[database]
# Name of the environment variable holding the PostgreSQL URL. The URL (and
# any password) is never written in this file. Demo mode accepts only a
# loopback database host.
url_env = "EYE_DATABASE_URL"

[providers]
# Real provider adapters stay disabled until approved in
# docs/source-policy-register.md. Package 0 has none, so this must stay empty.
enabled = []

[retention]
# Package 5 lifecycle. Retention prunes raw evidence bytes of one partition
# (source, layer, UTC day) only after every check passes; rows are never
# deleted. Deletion stays disabled unless set to true, and is refused outside
# demo mode. Nothing in setup, verify, the demo or CI enables it.
allow_deletion = false
# A partition stays open to late arrivals for this many hours after its day ends.
# At least 48: the database refuses pruning sooner, by its own clock.
lateness_hours = 48
# Name of the environment variable holding the synthetic backup directory.
# The path itself is never written in this file.
backup_dir_env = "EYE_BACKUP_DIR"
# Name of the environment variable holding the URL of an EMPTY loopback
# database that `db-restore-drill` restores into (never the main database).
restore_url_env = "EYE_RESTORE_DATABASE_URL"

[research]
# Package 5 coverage-weighted baselines and backtester (`db-backtest`). A target
# bin is compared with the same bin on each of the previous history_days days.
# Only exactly covered hours count; a gap is never a zero. Results are facts
# (verdict, reason code, numbers), never prose, and no model is involved.
# Bin length in hours, aligned to the UTC day: 1, 2, 3, 4, 6, 8, 12 or 24.
bin_hours = 1
history_days = 14
# Abstain unless the history holds at least this many bins' worth of exact coverage.
min_history_bins = 3
# A bin is detected only when it exceeds the baseline by at least min_excess and
# by at least threshold_sigma standard deviations (one-sided: more than expected).
threshold_sigma = 5
min_excess = 4
# Abstain unless this percentage of the target bin is exactly covered.
min_target_coverage_pct = 100
# Hard bounds: a larger request is refused, never cut short.
max_days = 92
max_output_rows = 10000

[imagery]
# Package 6: one bounded imagery product, Copernicus Sentinel-2 Level-2A
# (`copernicus-sentinel-2-l2a`, a disabled candidate in
# docs/source-policy-register.md). Real imagery stays disabled: true is refused,
# and this repository has no real download transport. These limits are
# enforced by the adapter and its synthetic tests now, so they are explicit
# before any real product is enabled. The byte defaults are provisional: no
# real L2A product size has been measured yet (UNVERIFIED).
enabled = false
# Name of the environment variable holding the raster worker's scratch
# directory. The path itself is never written in this file.
scratch_dir_env = "EYE_IMAGERY_SCRATCH_DIR"
# One downloaded archive. A larger declared or streamed body is refused.
max_product_bytes = 1500000000
# Everything on scratch: cached archives plus the download in progress. A new
# download first evicts least recently used products; if that cannot make room,
# it is refused and nothing is evicted.
max_scratch_bytes = 4000000000
max_cached_products = 2
# Per UTC day: downloads started, and bytes received (admitted or not). The
# worst case per day is max_bytes_per_day received.
max_products_per_day = 4
max_bytes_per_day = 6000000000
# Redirects followed per download, each only to the allowed download host.
max_redirects = 3
# Archive checks (malformed-archive and zip-bomb bounds).
max_archive_members = 1000
max_uncompressed_bytes = 2000000000
max_compression_ratio = 100
max_metadata_bytes = 4000000
# Read size for streaming; memory use does not grow with product size.
chunk_bytes = 1048576
# Freshness: a product sensed longer ago than this is shown as stale, with its
# sensing date, never as the current state.
stale_after_hours = 240
